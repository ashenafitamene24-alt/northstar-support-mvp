<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Northstar Support Chatbot MVP</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="chat-widget">
    <div class="chat-header">Northstar Retail Co.<span class="status-dot"></span>support
    </div>
       <div class="chat-messages" id="chat-messages">
  <div class="message bot">
    Hi! I'm star your Support Chatbot. How can I assist you today?
  </div>
</div>

    <div class="chat-input">
      <input 
       type="text"
       id="user-input"
       placeholder="Type your message here..."
       autocomplete="off" />
      <button id="send-button">Send</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
