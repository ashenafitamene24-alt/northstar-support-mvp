<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Northstar Support Chatbot MVP</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="chat-widget">
    <div class="chat-header">Northstar Retail Co.<span class="status-dot"></span>online
    </div>
       <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input-row">
      <input 
       type="text"
       id="chatInput"
       placeholder="Type your message here..."
       autocomplete="off" />
      <button id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke-width="2">>
          <path d="M2,20L21,12L3,4L3,12L3,14Z" fill="white" stroke="none"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="js/orders.js"></script>
  <script src="js/orderStatus.js"></script>
  <script src="script.js"></script>
</body>
</html>
